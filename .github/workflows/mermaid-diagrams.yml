name: Generate Mermaid diagrams

on:
  push:
    paths:
      - 'diagrams/**/*.mmd'
      - '.github/workflows/mermaid-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Generate diagrams from .mmd files
        run: |
          mkdir -p media
          for f in diagrams/*.mmd; do
            name=$(basename "$f" .mmd)
            echo "Generating diagram for $f -> media/${name}.svg"
            mmdc -i "$f" -o "media/${name}.svg"
          done

      - name: Commit and push generated diagrams
        run: |
          if git status --porcelain | grep 'media/'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add media
            git commit -m "chore: update Mermaid diagrams"
            git push
          else
            echo "No diagram changes to commit."
          fi
